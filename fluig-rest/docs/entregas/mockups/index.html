<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Controle de Embalagens — mockup Fluig</title>
<style>
:root{font-family:Arial,Helvetica,sans-serif;color:#333;background:#f5f6f7;font-size:14px;--orange:#b9540a;--orange-soft:#fff1e7;--blue:#276f94;--line:#d9dde1;--muted:#66717b;--green:#24734f;--red:#a63b32}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{min-height:38px;padding:8px 13px;border:1px solid #c6cbd0;border-radius:4px;background:#fff;color:#333;cursor:pointer}button:hover{background:#f3f4f5}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #73aeca;outline-offset:2px}button.primary{background:var(--orange);border-color:var(--orange);color:#fff}button.link{border:0;background:transparent;color:var(--blue);padding:4px 7px;min-height:30px}button.danger{color:var(--red)}button:disabled{opacity:.5;cursor:not-allowed}input,select{width:100%;min-height:38px;padding:8px 10px;border:1px solid #bfc5ca;border-radius:4px;background:#fff;color:#333}input[type=checkbox]{width:auto;min-height:auto}input[readonly]{background:#eef0f2}label{display:block;margin-bottom:6px;font-weight:600;color:#41484e}h1{margin:4px 0 6px;font-size:25px;font-weight:500}h2{font-size:17px;margin:0 0 16px}p{line-height:1.5}.app-header{height:64px;padding:0 24px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}.brand{font-size:18px;font-weight:700}.brand span{font-size:13px;color:#777;font-weight:400}.environment{font-size:12px;background:#e8f2f7;color:#23536b;padding:7px 10px;border-radius:4px}.layout{display:grid;grid-template-columns:238px minmax(0,1fr);min-height:calc(100vh - 64px)}nav{background:#fff;border-right:1px solid var(--line);padding:22px 12px}.nav-title{padding:8px 12px;color:#777;font-size:11px;font-weight:700}.nav-button{display:block;width:100%;margin:6px 0;border:0;border-left:3px solid transparent;border-radius:0;text-align:left;line-height:1.35}.nav-button.active{background:var(--orange-soft);border-left-color:var(--orange);color:#8a410c}main{min-width:0;padding:25px}.crumb{color:#777;font-size:12px;margin-bottom:11px}.subtitle{margin:0 0 20px;color:#5d656c}.screen-tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:0 0 18px}.screen-tab{border:0;border-bottom:3px solid transparent;border-radius:0;background:transparent;padding:11px 17px}.screen-tab.active{color:var(--orange);border-bottom-color:var(--orange);font-weight:700}.panel{background:#fff;border:1px solid var(--line);border-radius:5px;padding:19px;margin:0 0 16px}.filters{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:15px}.field{position:relative;min-width:0}.hint{min-height:15px;margin-top:5px;color:#6a737b;font-size:11px}.list-header{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-top:16px}.actions-left,.actions-right,.row-actions,.modal-actions,.batch-bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.feedback{padding:11px 14px;border:1px solid #bed5e0;background:#edf6fa;color:#174961;border-radius:4px;margin:12px 0}.feedback:empty{display:none}.batch-bar{justify-content:flex-start;margin:12px 0}.batch-bar select{width:auto;min-width:240px}.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:4px;background:#fff}table{width:100%;border-collapse:collapse}th,td{padding:12px 11px;border-bottom:1px solid #e3e5e7;text-align:left;white-space:nowrap;vertical-align:middle}th{background:#f0f2f3;font-weight:600;color:#444}tbody tr:hover{background:#fafbfb}.pill{display:inline-block;padding:4px 8px;border-radius:12px;background:#edf2f5;color:#4c5b65;font-size:12px}.summary{display:flex;justify-content:space-between;gap:12px;margin:13px 1px;color:#6d747a;font-size:12px}.switch{position:relative;display:inline-flex;align-items:center;gap:8px;margin:0;font-weight:400}.switch input{position:absolute;opacity:0;width:1px;height:1px}.track{width:38px;height:21px;background:#9ca4aa;border-radius:11px;position:relative;transition:.2s}.track:after{content:"";position:absolute;width:17px;height:17px;top:2px;left:2px;border-radius:50%;background:#fff;box-shadow:0 1px 3px #0004;transition:.2s}.switch input:checked+.track{background:var(--green)}.switch input:checked+.track:after{left:19px}.switch-text{font-size:12px;color:#5b646b}.suggestions{position:absolute;z-index:20;left:0;right:0;top:63px;max-height:260px;overflow:auto;border:1px solid #aeb5ba;border-radius:4px;background:#fff;box-shadow:0 5px 18px #0002}.suggestions button{display:block;width:100%;border:0;border-bottom:1px solid #eee;border-radius:0;text-align:left}.suggestions button:hover{background:#edf5f8}.note{padding:12px 14px;background:#f1f7fa;border-left:3px solid #3181ab;margin:0 0 18px;font-size:13px}.warning{background:#fff7e8;border-left-color:#d49525}.placeholder{padding:36px 24px;text-align:center;border:1px dashed #bfc6cb;border-radius:5px;color:#5f686f;background:#fafbfb}.placeholder h2{color:#3f474d}.technical{margin-top:18px}.technical summary{cursor:pointer;color:var(--blue)}.technical table{margin-top:12px;font-size:12px}.technical td{white-space:normal}.local-filter{display:flex;gap:10px;align-items:end;margin:16px 0}.local-filter .field{flex:1}dialog{width:min(980px,calc(100% - 30px));max-height:90vh;padding:0;border:1px solid #c9cdd1;border-radius:7px;box-shadow:0 10px 42px #0004}dialog::backdrop{background:#0007}.modal-header{display:flex;align-items:center;justify-content:space-between;gap:15px;padding:18px 22px;border-bottom:1px solid var(--line)}.modal-header h2{margin:0}.modal-body{padding:22px}.modal-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}.modal-actions{justify-content:flex-end;margin-top:20px}.steps{display:flex;gap:8px;margin-bottom:18px}.step{flex:1;padding:9px;background:#eceff1;color:#657078;border-radius:4px;text-align:center;font-size:12px}.step.active{background:var(--orange-soft);color:#8a410c;font-weight:700}.muted{color:var(--muted)}
@media(max-width:1000px){.filters{grid-template-columns:repeat(2,minmax(0,1fr))}.layout{grid-template-columns:205px minmax(0,1fr)}}@media(max-width:720px){.app-header{padding:0 15px}.layout{display:block}nav{display:flex;overflow:auto;padding:8px;border-right:0;border-bottom:1px solid var(--line)}.nav-title{display:none}.nav-button{min-width:160px;margin:0}.filters,.modal-grid{grid-template-columns:1fr}main{padding:17px}.list-header,.summary{align-items:flex-start;flex-direction:column}.screen-tabs{overflow:auto}.screen-tab{white-space:nowrap}}
</style>

<body>
<header class="app-header"><div class="brand">BRANCO PERES <span>| Fluig</span></div><span class="environment">Protótipo · sem chamadas reais</span></header>
<div class="layout"><nav aria-label="Controle de Embalagens"><div class="nav-title">CONTROLE DE EMBALAGENS</div><button class="nav-button active" data-screen="embalagens">Embalagens</button><button class="nav-button" data-screen="bags">Bags</button><button class="nav-button" data-screen="etiquetas">Manutenção de Etiquetas</button><button class="nav-button" data-screen="monitor">Monitor de Documentos</button></nav><main><div class="crumb">Portal / Controle de Embalagens</div><h1 id="page-title"></h1><p id="page-subtitle" class="subtitle"></p><div id="tabs" class="screen-tabs"></div><section id="content"></section></main></div>
<dialog id="modal"><div class="modal-header"><h2 id="modal-title"></h2><button type="button" class="link" data-close>Fechar</button></div><div id="modal-body" class="modal-body"></div></dialog>
<script>
const demo={estabelecimentos:[{codigo:'10901',descricao:'Fazenda 10901'},{codigo:'10902',descricao:'Fazenda 10902'},{codigo:'10904',descricao:'Fazenda 10904'}],itens:[{codigo:'365131',descricao:'DIMEXION - ONU 3018',un:'LT'},{codigo:'361378',descricao:'OMITE 720 CE BR - ONU 3082',un:'LT'},{codigo:'357867',descricao:'REGLONE',un:'LT'}],tipos:[{codigo:'PL',descricao:'PLÁSTICA',ativo:true},{codigo:'MT',descricao:'METÁLICA',ativo:true},{codigo:'RF',descricao:'REFORÇADA',ativo:false}],parametros:[{id:1,est:'10901 — Fazenda 10901',item:'365131 — DIMEXION - ONU 3018',un:'LT',tipo:'PL — PLÁSTICA',cap:'20,0000',ativo:true},{id:2,est:'10902 — Fazenda 10902',item:'361378 — OMITE 720 CE BR - ONU 3082',un:'LT',tipo:'PL — PLÁSTICA',cap:'10,0000',ativo:true}],bags:[{id:'41',lacre:'LC-00041',tipo:'PL — PLÁSTICA',est:'10901 — Fazenda 10901',situacao:'ABERTA (demonstração)',emb:2,qtd:'30,0000 LT'},{id:'42',lacre:'LC-00042',tipo:'MT — METÁLICA',est:'10902 — Fazenda 10902',situacao:'Estado ilustrativo',emb:0,qtd:'0,0000 LT'}],etiquetas:[{codigo:'EMB-DEMO-001',item:'361378 — OMITE 720 CE BR - ONU 3082',lote:'2026/1',validade:'31/12/2026',qtd:'20,0000 LT',est:'10901',deposito:'INS',custodia:'INTERNA',situacao:'Disponível',bag:'41'},{codigo:'EMB-DEMO-002',item:'365131 — DIMEXION - ONU 3018',lote:'LOTE-DEMO',validade:'31/12/2026',qtd:'10,0000 LT',est:'10902',deposito:'INS',custodia:'TERCEIRO',situacao:'Demonstração',bag:'—'},{codigo:'PRE-DEMO-001',item:'365131 — DIMEXION - ONU 3018',lote:'LOTE-DEMO',validade:'31/12/2026',qtd:'40,0000 LT',est:'10901',deposito:'INS',custodia:'INTERNA',situacao:'PRE_SALDO',bag:'—'}]};
const state={screen:'embalagens',tab:'tipos'};const screens={embalagens:{title:'Embalagens',subtitle:'Cadastros de tipos de embalagem e itens controlados.',tabs:[['tipos','Tipos de Embalagem'],['itens','Itens Controlados']]},bags:{title:'Bags',subtitle:'Manutenção das Bags e consulta somente leitura.',tabs:[['manutencao','Manutenção de Bags'],['consulta','Consulta de Bags']]},etiquetas:{title:'Manutenção de Etiquetas',subtitle:'Consulta das embalagens, posições, vínculos e operações.',tabs:[]},monitor:{title:'Monitor de Documentos de Recebimento',subtitle:'Área independente para o acompanhamento de documentos.',tabs:[]}};const $=s=>document.querySelector(s),content=$('#content'),modal=$('#modal');const esc=v=>String(v??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
function openModal(){if(!modal.open)modal.showModal()}
function autocomplete(id,label,source,extra=''){return `<div class="field"><label for="${id}">${label}</label><input id="${id}" class="autocomplete" data-source="${source}" placeholder="Digite código ou descrição" autocomplete="off" ${extra}><div class="hint">O Progress pesquisa código OU descrição; o Fluig apresenta ambos.</div><div class="suggestions" hidden></div></div>`}
function filters(fields,hasNew=true,newLabel='Novo'){return `<section class="panel"><h2>Filtros</h2><div class="filters">${fields}</div><div class="list-header"><div class="actions-left"><button class="primary" data-action="buscar">Buscar</button><button data-action="limpar">Limpar</button></div>${hasNew?`<div class="actions-right"><button class="primary" data-action="novo">+ ${newLabel}</button></div>`:''}</div></section><div id="feedback" class="feedback" aria-live="polite"></div>`}
function toggle(checked,id){return `<label class="switch"><input type="checkbox" data-toggle="${id}" ${checked?'checked':''}><span class="track"></span><span class="switch-text">${checked?'Ativo':'Inativo'}</span></label>`}
function batchBar(options){return `<div class="batch-bar"><select data-batch-action><option value="">Selecione uma ação em lote</option>${options.map(x=>`<option>${x}</option>`).join('')}</select><button data-batch-execute>Executar</button></div>`}
function table(headers,rows,selectable=false){return `<div class="summary"><span>${rows.length} registros demonstrativos</span><span>As ações pertencem ao respectivo registro</span></div><div class="table-wrap"><table><thead><tr>${selectable?'<th><input type="checkbox" data-check-all aria-label="Selecionar todos"></th>':''}${headers.map(h=>`<th>${h}</th>`).join('')}<th>Ações</th></tr></thead><tbody>${rows.join('')}</tbody></table></div>`}
function technical(rows){return `<details class="technical"><summary>Mapa técnico desta área</summary><div class="table-wrap"><table><thead><tr><th>Controle</th><th>Procedure/contrato existente</th><th>Estado</th></tr></thead><tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div></details>`}
function actions(items){return `<div class="row-actions">${items.map(([id,label,cls=''])=>`<button class="link ${cls}" data-row-action="${id}">${label}</button>`).join('')}</div>`}
function renderTipos(){content.innerHTML=filters(`${autocomplete('f-tipo','Tipo de Embalagem','tipos')}<div class="field"><label>Situação</label><select><option>Todos</option><option>Ativo</option><option>Inativo</option></select></div>`,true,'Novo Tipo')+table(['Código','Descrição','Situação'],demo.tipos.map(t=>`<tr data-key="${t.codigo}"><td>${t.codigo}</td><td>${t.descricao}</td><td>${toggle(t.ativo,'tipo:'+t.codigo)}</td><td>${actions([['editar-tipo','Editar']])}</td></tr>`))+technical([['Autocomplete','consultarTiposApoio · GET /apoios/tipos','Compilado; REST/Dataset pendentes'],['Consulta','consultarTipos · GET /tipos','REST verificado'],['Novo/Editar/Toggle','salvarTipo · POST/PATCH /tipos','Integração Fluig pendente']])}
function renderItens(){content.innerHTML=filters(`${autocomplete('f-param-est','Estabelecimento','estabelecimentos')}${autocomplete('f-param-item','Item','itens')}${autocomplete('f-param-tipo','Tipo de Embalagem','tipos')}<div class="field"><label>Situação</label><select><option>Todos</option><option>Ativo</option><option>Inativo</option></select></div>`,true,'Novo Item Controlado')+table(['Estabelecimento','Item','Unidade','Tipo de Embalagem','Capacidade','Situação'],demo.parametros.map(p=>`<tr data-key="${p.id}"><td>${p.est}</td><td>${p.item}</td><td>${p.un}</td><td>${p.tipo}</td><td>${p.cap}</td><td>${toggle(p.ativo,'param:'+p.id)}</td><td>${actions([['editar-param','Editar'],['excluir-param','Excluir','danger']])}</td></tr>`))+technical([['Estabelecimento','consultarEstabelecimentos · GET /apoios/estabelecimentos','ABL aprovado; REST/Dataset pendentes'],['Item','consultarItens · GET /apoios/itens','ABL aprovado; REST/Dataset pendentes'],['Consulta','consultarParametros · GET /parametros','REST parcial'],['Novo/Editar/Toggle','salvarParametro · POST/PATCH /parametros','ABL integrado aprovado; REST/Dataset pendentes']])}
function bagFilters(){return `${autocomplete('f-bag-est','Estabelecimento','estabelecimentos')}${autocomplete('f-bag-tipo','Tipo de Embalagem','tipos')}<div class="field"><label>Lacre</label><input placeholder="Lacre"></div><div class="field"><label>Situação</label><select><option>Todos</option><option>ABERTA (ilustrativa)</option><option>Demais estados — a definir</option></select></div><div class="field"><label>Período inicial</label><input type="date"></div><div class="field"><label>Período final</label><input type="date"></div>`}
function bagRows(readonly=false){return demo.bags.map(b=>`<tr data-key="${b.id}"><td>${b.id}</td><td>${b.lacre}</td><td>${b.tipo}</td><td>${b.est}</td><td><span class="pill">${b.situacao}</span></td><td>${b.emb}</td><td>${b.qtd}</td><td>${actions(readonly?[['ver-conteudo','Conteúdo'],['historico-bag','Histórico'],['imprimir-bag','Imprimir']]:[['editar-bag','Editar'],['gerenciar-conteudo','Conteúdo'],['eventos-bag','Eventos']])}</td></tr>`)}
function renderBagManutencao(){content.innerHTML=filters(bagFilters(),true,'Nova Bag')+table(['Bag','Lacre','Tipo','Estabelecimento','Situação','Embalagens','Quantidade'],bagRows(false))+`<div class="note warning" style="margin-top:16px">Criação, edição, conteúdo e eventos permanecem como proposta visual. O mockup não libera transições nem cria documentos.</div>`+technical([['Consulta','consultarBags · GET /bags','ABL aprovado; REST/Dataset pendentes'],['Conteúdo','consultarConteudoBag · GET /conteudo-bag','ABL aprovado; REST/Dataset pendentes'],['Criar/Editar/Eventos','Procedures BAG propostas','Contratos pendentes']])}
function renderBagConsulta(){content.innerHTML=filters(bagFilters(),false)+`<div class="note">Esta aba é somente leitura. Nenhuma ação altera a Bag ou seu conteúdo.</div>`+table(['Bag','Lacre','Tipo','Estabelecimento','Situação','Embalagens','Quantidade'],bagRows(true))+technical([['Consulta','consultarBags · GET /bags','ABL aprovado; REST/Dataset pendentes'],['Conteúdo','consultarConteudoBag · GET /conteudo-bag','ABL aprovado; REST/Dataset pendentes'],['Histórico/Impressão','Contratos específicos','Propostos; não implementados']])}
function renderEtiquetas(){const fields=`${autocomplete('f-etq-est','Estabelecimento','estabelecimentos')}${autocomplete('f-etq-item','Item','itens')}${autocomplete('f-etq-tipo','Tipo de Embalagem','tipos')}<div class="field"><label>Etiqueta</label><input placeholder="Código exato"></div><div class="field"><label>Depósito</label><input placeholder="Apoio pendente"></div><div class="field"><label>Lote</label><input placeholder="Lote"></div><div class="field"><label>Validade inicial</label><input type="date"></div><div class="field"><label>Validade final</label><input type="date"></div><div class="field"><label>Situação</label><select><option>Todos</option><option>Disponível</option><option>PRE_SALDO</option></select></div><div class="field"><label>Custódia</label><select><option>Todas</option><option>INTERNA</option><option>TERCEIRO</option></select></div><div class="field"><label>Bag / lacre</label><input placeholder="Bag ou lacre"></div>`;content.innerHTML=filters(fields,false)+batchBar(['Imprimir / reimprimir','Transferir / remeter terceiros','Devolver / retornar terceiros','Emprestar','Renovar','Retomar operação'])+table(['Etiqueta','Item','Lote','Validade','Quantidade','Estab.','Depósito','Custódia','Situação','Bag'],demo.etiquetas.map(e=>`<tr data-key="${e.codigo}"><td><input type="checkbox" data-row-check aria-label="Selecionar ${e.codigo}" ${e.situacao==='PRE_SALDO'?'disabled':''}></td><td>${e.codigo}</td><td>${e.item}</td><td>${e.lote}</td><td>${e.validade}</td><td>${e.qtd}</td><td>${e.est}</td><td>${e.deposito}</td><td>${e.custodia}</td><td><span class="pill">${e.situacao}</span></td><td>${e.bag}</td><td>${actions(e.situacao==='PRE_SALDO'?[['detalhe-etq','Detalhe'],['historico-etq','Histórico']]:[['detalhe-etq','Detalhe'],['historico-etq','Histórico'],['imprimir-etq','Imprimir'],['operar-etq','Operações']])}</td></tr>`),true)+`<div class="note warning" style="margin-top:16px">Filtros e operações sem contrato continuam apenas como referência visual e não disparam chamadas.</div>`+technical([['Consulta','consultarEtiquetas · GET /etiquetas','ABL aprovado; filtros ampliados/REST/Fluig pendentes'],['Impressão','obterDadosImpressao · GET /dados-impressao','ABL aprovado; serviço/layout pendentes'],['Histórico e operações','Contratos específicos','Propostos; não implementados']])}
function renderMonitor(){content.innerHTML=`<div class="placeholder"><h2>Mockup separado — definição funcional pendente</h2><p>O Monitor permanece como contingência até a validação do AED padrão do ANFE por estabelecimento.</p><p>Filtros, colunas, ações e integrações não foram desenhados para evitar criar contratos ou regras ainda não aprovados.</p></div><div class="note warning" style="margin-top:16px">Esta área não executa consulta, aprovação, recebimento ou atualização de documento.</div>`}
function render(){const cfg=screens[state.screen];$('#page-title').textContent=cfg.title;$('#page-subtitle').textContent=cfg.subtitle;document.querySelectorAll('.nav-button').forEach(b=>b.classList.toggle('active',b.dataset.screen===state.screen));$('#tabs').innerHTML=cfg.tabs.map(([id,label])=>`<button class="screen-tab ${state.tab===id?'active':''}" data-tab="${id}">${label}</button>`).join('');$('#tabs').hidden=!cfg.tabs.length;if(state.screen==='embalagens'&&state.tab==='tipos')renderTipos();else if(state.screen==='embalagens')renderItens();else if(state.screen==='bags'&&state.tab==='manutencao')renderBagManutencao();else if(state.screen==='bags')renderBagConsulta();else if(state.screen==='etiquetas')renderEtiquetas();else renderMonitor();bind()}
function modalForm(title,body,save='Salvar'){$('#modal-title').textContent=title;$('#modal-body').innerHTML=`${body}<div class="modal-actions"><button data-close>Cancelar</button><button class="primary" data-modal-save>${save}</button></div>`;openModal();bindModal()}
function typeForm(edit=false){modalForm(edit?'Editar Tipo de Embalagem':'Novo Tipo de Embalagem',`<div class="note">Cadastro demonstrativo. A confirmação usará somente o contrato já mapeado.</div><div class="modal-grid"><div class="field"><label>Código</label><input ${edit?'readonly value="PL"':''} maxlength="3"></div><div class="field"><label>Descrição</label><input ${edit?'value="PLÁSTICA"':''}></div></div>`,edit?'Salvar alterações':'Criar tipo')}
function paramForm(edit=false){modalForm(edit?'Editar Item Controlado':'Novo Item Controlado',`<div class="note">Estabelecimento e item ficam imutáveis na edição. A unidade vem do item; a conversão pertence ao salvamento.</div><div class="modal-grid">${autocomplete('m-est','Estabelecimento','estabelecimentos',edit?'readonly value="10901 — Fazenda 10901"':'')}${autocomplete('m-item','Item','itens',edit?'readonly value="365131 — DIMEXION - ONU 3018"':'')}<div class="field"><label>Unidade</label><input readonly value="${edit?'LT':''}"></div>${autocomplete('m-tipo','Tipo de Embalagem','tipos',edit?'value="PL — PLÁSTICA"':'')}<div class="field"><label>Capacidade</label><input type="number" min="0.0001" step="0.0001" value="${edit?'20':''}"></div></div>`,edit?'Salvar alterações':'Criar parametrização')}
function bagForm(edit=false){modalForm(edit?'Editar Bag':'Nova Bag',`<div class="note warning">Campos cuja obrigatoriedade ainda está pendente continuam ilustrativos.</div><div class="modal-grid">${autocomplete('m-bag-est','Estabelecimento','estabelecimentos',edit?'readonly value="10901 — Fazenda 10901"':'')}${autocomplete('m-bag-tipo','Tipo de Embalagem','tipos',edit?'value="PL — PLÁSTICA"':'')}<div class="field"><label>Lacre</label><input value="${edit?'LC-00041':''}"></div><div class="field"><label>Destino</label><input placeholder="Origem pendente"></div><div class="field"><label>Motorista</label><input placeholder="Origem pendente"></div><div class="field"><label>Observação</label><input placeholder="Persistência pendente"></div></div>`,edit?'Salvar alterações':'Criar Bag')}
function bagContent(readonly=false){
 $('#modal-title').textContent=(readonly?'Consultar':'Gerenciar')+' Conteúdo da Bag 41';
 $('#modal-body').innerHTML=`<div class="note">A pesquisa abaixo filtra localmente somente o conteúdo já carregado desta Bag.</div><div id="modal-feedback" class="feedback"></div><div class="list-header"><div class="local-filter" style="flex:1;margin:0"><div class="field"><label for="bag-local">Pesquisar dentro desta Bag</label><input id="bag-local" placeholder="Etiqueta, item ou lote"></div><button data-local-clear>Limpar</button></div>${readonly?'':`<div class="actions-right"><button class="primary" data-insert-bag>+ Inserir embalagens</button></div>`}</div>${readonly?'':batchBar(['Remover selecionadas da Bag'])}<div class="table-wrap" style="margin-top:12px"><table><thead><tr>${readonly?'':'<th><input type="checkbox" data-check-all aria-label="Selecionar todos"></th>'}<th>Etiqueta</th><th>Item</th><th>Lote</th><th>Quantidade</th></tr></thead><tbody id="bag-content-rows"><tr data-search="EMB-DEMO-001 361378 2026/1">${readonly?'':'<td><input type="checkbox" data-row-check></td>'}<td>EMB-DEMO-001</td><td>361378</td><td>2026/1</td><td>20,0000 LT</td></tr><tr data-search="EMB-DEMO-002 365131 LOTE-DEMO">${readonly?'':'<td><input type="checkbox" data-row-check></td>'}<td>EMB-DEMO-002</td><td>365131</td><td>LOTE-DEMO</td><td>10,0000 LT</td></tr></tbody></table></div>${readonly?'':'<div class="note warning" style="margin-top:16px">A lista contém somente embalagens já vinculadas. A remoção permanece como proposta não implementada.</div>'}<div class="modal-actions"><button data-close>Fechar</button></div>`;
 openModal();bindModal();bindBatch();
 const input=$('#bag-local');input.addEventListener('input',()=>{const q=input.value.trim().toLowerCase();document.querySelectorAll('#bag-content-rows tr').forEach(r=>r.hidden=!r.dataset.search.toLowerCase().includes(q))});$('[data-local-clear]').onclick=()=>{input.value='';input.dispatchEvent(new Event('input'))};
 const insert=$('[data-insert-bag]');if(insert)insert.onclick=bagInsert;
}
function bagInsert(){
 $('#modal-title').textContent='Inserir Embalagens na Bag 41';
 $('#modal-body').innerHTML=`<div class="note warning">Somente embalagens elegíveis para esta Bag poderão ser vinculadas. Critérios e comandos permanecem como proposta.</div><div id="modal-feedback" class="feedback"></div><section class="panel"><h2>Inserção direta por código de barras</h2><div class="list-header"><div class="field" style="flex:1"><label for="bag-scan">Etiqueta</label><input id="bag-scan" placeholder="Leia ou digite o código da etiqueta" autofocus><div class="hint">Uma etiqueta por vez.</div></div><button class="primary" data-direct-insert>Inserir na Bag</button></div></section><section class="panel"><h2>Buscar etiquetas elegíveis para inclusão em lote</h2><div class="filters">${autocomplete('bag-ins-est','Estabelecimento','estabelecimentos')}${autocomplete('bag-ins-item','Item','itens')}${autocomplete('bag-ins-tipo','Tipo de Embalagem','tipos')}<div class="field"><label>Etiqueta inicial</label><input placeholder="Faixa inicial"></div><div class="field"><label>Etiqueta final</label><input placeholder="Faixa final"></div></div><div class="actions-left" style="margin-top:15px"><button class="primary" data-search-eligible>Buscar</button><button data-clear-eligible>Limpar</button></div></section>${batchBar(['Inserir selecionadas na Bag'])}<div class="table-wrap"><table><thead><tr><th><input type="checkbox" data-check-all aria-label="Selecionar todas"></th><th>Etiqueta</th><th>Item</th><th>Lote</th><th>Validade</th><th>Quantidade</th></tr></thead><tbody><tr><td><input type="checkbox" data-row-check></td><td>EMB-ELEGIVEL-003</td><td>361378</td><td>2026/2</td><td>31/12/2026</td><td>10,0000 LT</td></tr><tr><td><input type="checkbox" data-row-check></td><td>EMB-ELEGIVEL-004</td><td>361378</td><td>2026/2</td><td>31/12/2026</td><td>10,0000 LT</td></tr></tbody></table></div><div class="modal-actions"><button data-back-content>Voltar ao conteúdo</button><button data-close>Fechar</button></div>`;
 bindModal();bindBatch();
 $('[data-back-content]').onclick=()=>bagContent(false);
 $('[data-direct-insert]').onclick=()=>{const code=$('#bag-scan').value.trim();modalFeedback(code?'Inclusão direta simulada para '+code+'. Nenhum vínculo foi gravado.':'Leia ou digite uma etiqueta.')};
 $('[data-search-eligible]').onclick=()=>modalFeedback('Busca de elegíveis simulada. Nenhuma chamada real foi executada.');
 $('[data-clear-eligible]').onclick=()=>{document.querySelectorAll('#modal-body input:not([type=checkbox])').forEach(i=>i.value='');modalFeedback('Filtros limpos.')};
}
function guidedOperation(title='Operação com Etiquetas',selected=[]){
 $('#modal-title').textContent=title;
 const chosen=selected.length?selected:['EMB-DEMO-001 — 361378 — 20,0000 LT'];
 $('#modal-body').innerHTML=`<div class="steps"><div class="step active">1. Embalagens</div><div class="step">2. Natureza</div><div class="step">3. Origem, quando exigida</div><div class="step">4. Conferência e criação</div></div><div class="note warning">Fluxo visual: cada confirmação cria um documento. Nenhuma BO/API é chamada neste mockup.</div><section class="panel"><h2>Embalagens selecionadas</h2><div class="table-wrap"><table><thead><tr><th>Etiqueta / item / quantidade</th></tr></thead><tbody>${chosen.map(v=>`<tr><td>${esc(v)}</td></tr>`).join('')}</tbody></table></div></section><div class="modal-grid"><div class="field"><label for="m-natureza">Natureza da operação</label><select id="m-natureza"><option value="">Selecione a natureza</option><option value="transferencia">Transferência — exemplo visual</option><option value="devolucao">Devolução — exemplo visual</option><option value="terceiros">Terceiros — exemplo visual</option></select><div class="hint">Códigos e elegibilidade virão do apoio Progress ainda pendente.</div></div>${autocomplete('m-destino','Estabelecimento destino','estabelecimentos')}</div><div id="origem-ft" hidden><div class="note">Para devolução, selecione uma origem elegível. O emitente e os itens/quantidades serão preenchidos a partir do documento e revalidados antes da criação.</div><div class="modal-grid"><div class="field"><label for="m-doc-origem">Documento de origem</label><input id="m-doc-origem" placeholder="Buscar documento elegível — contrato pendente"></div><div class="field"><label>Emitente</label><input readonly placeholder="Preenchido pela origem"></div></div><div class="table-wrap" style="margin-top:15px"><table><thead><tr><th>Item da origem</th><th>Quantidade original</th><th>Disponível</th><th>Quantidade a devolver</th></tr></thead><tbody><tr><td colspan="4">Selecione um documento para carregar itens e quantidades.</td></tr></tbody></table></div></div><div id="sem-origem-ft" class="note">Escolha a natureza para definir os dados exigidos pela operação.</div><div class="modal-actions"><button data-close>Cancelar</button><button disabled>Criar documento — contrato pendente</button></div>`;
 openModal();bindModal();
 const natureza=$('#m-natureza'),origem=$('#origem-ft'),semOrigem=$('#sem-origem-ft');
 natureza.onchange=()=>{const devolucao=natureza.value==='devolucao';origem.hidden=!devolucao;semOrigem.hidden=devolucao;if(!devolucao)semOrigem.textContent=natureza.value?'Esta natureza não exige documento de origem neste exemplo.':'Escolha a natureza para definir os dados exigidos pela operação.'};
}
function detailEtiqueta(){const e=demo.etiquetas[0];$('#modal-title').textContent='Detalhe '+e.codigo;$('#modal-body').innerHTML=`<div class="note">Situação, posição, vínculo com Bag e quantidade são informações distintas.</div><div class="table-wrap"><table><tbody>${Object.entries(e).map(([k,v])=>`<tr><th>${esc(k)}</th><td>${esc(v)}</td></tr>`).join('')}</tbody></table></div><div class="modal-actions"><button data-close>Fechar</button></div>`;openModal();bindModal()}
function proposal(title){$('#modal-title').textContent=title;$('#modal-body').innerHTML=`<div class="note warning">Esta funcionalidade continua somente como mockup/proposta. Nenhuma chamada ou alteração foi executada.</div><div class="modal-actions"><button data-close>Fechar</button></div>`;openModal();bindModal()}
function bindModal(){document.querySelectorAll('#modal [data-close]').forEach(b=>b.onclick=()=>modal.close());document.querySelectorAll('#modal .autocomplete').forEach(bindAutocomplete);const save=$('[data-modal-save]');if(save)save.onclick=()=>{save.textContent='Simulação concluída';save.disabled=true}}
function bindAutocomplete(input){if(input.readOnly)return;const list=input.parentElement.querySelector('.suggestions');if(!list)return;const source=demo[input.dataset.source]||[];input.addEventListener('input',()=>{const q=input.value.trim().toLocaleLowerCase('pt-BR');if(q.length<2){list.hidden=true;return}const matches=source.filter(x=>(x.codigo+' '+x.descricao).toLocaleLowerCase('pt-BR').includes(q)).slice(0,20);list.innerHTML=matches.map(x=>`<button type="button" data-code="${esc(x.codigo)}">${esc(x.codigo)} — ${esc(x.descricao)}</button>`).join('')||'<button type="button" disabled>Nenhuma opção encontrada</button>';list.hidden=false;list.querySelectorAll('[data-code]').forEach((b,i)=>b.onclick=()=>{input.value=matches[i].codigo+' — '+matches[i].descricao;input.dataset.codigo=matches[i].codigo;list.hidden=true})});input.addEventListener('blur',()=>setTimeout(()=>list.hidden=true,150))}
function modalFeedback(message){const el=$('#modal-feedback');if(el)el.textContent=message}
function feedback(message){const el=modal.open?$('#modal-feedback'):$('#feedback');if(el)el.textContent=message}
function bindBatch(){
 document.querySelectorAll('[data-check-all]').forEach(all=>all.onchange=()=>all.closest('table').querySelectorAll('[data-row-check]').forEach(c=>{if(!c.disabled)c.checked=all.checked}));
 document.querySelectorAll('[data-batch-execute]').forEach(b=>b.onclick=()=>{const bar=b.closest('.batch-bar'),action=bar.querySelector('[data-batch-action]').value,scope=bar.parentElement,selected=scope.querySelectorAll('[data-row-check]:checked').length;if(!action){feedback('Selecione a ação em lote.');return}if(!selected){feedback('Selecione ao menos um registro.');return}if(action.includes('Bag')){modalFeedback(action+' simulada para '+selected+' registro(s). Nenhum vínculo foi alterado.');return}guidedOperation(action+' · '+selected+' selecionado(s)',Array.from(scope.querySelectorAll('[data-row-check]:checked')).map(c=>c.closest('tr').innerText.trim().replace(/\s+/g,' ')))});
}
function bind(){document.querySelectorAll('.autocomplete').forEach(bindAutocomplete);document.querySelectorAll('[data-action="buscar"]').forEach(b=>b.onclick=()=>feedback('Pesquisa demonstrativa. Nenhuma chamada real foi executada.'));document.querySelectorAll('[data-action="limpar"]').forEach(b=>b.onclick=()=>{content.querySelectorAll('input:not([type=checkbox]),select').forEach(i=>{i.value='';delete i.dataset.codigo});feedback('Filtros limpos.');});const novo=$('[data-action="novo"]');if(novo)novo.onclick=()=>state.screen==='embalagens'?(state.tab==='tipos'?typeForm():paramForm()):bagForm();document.querySelectorAll('[data-toggle]').forEach(t=>t.onchange=()=>{t.parentElement.querySelector('.switch-text').textContent=t.checked?'Ativo':'Inativo';feedback('Alteração simulada na linha. A integração usará o PATCH já mapeado.')});document.querySelectorAll('[data-row-action]').forEach(b=>b.onclick=()=>{const a=b.dataset.rowAction;if(a==='editar-tipo')typeForm(true);else if(a==='editar-param')paramForm(true);else if(a==='editar-bag')bagForm(true);else if(a==='gerenciar-conteudo')bagContent(false);else if(a==='ver-conteudo')bagContent(true);else if(a==='detalhe-etq')detailEtiqueta();else if(a==='operar-etq')guidedOperation('Operação com Etiquetas',[b.closest('tr').innerText.trim().replace(/\s+/g,' ')]);else proposal(b.textContent)});bindBatch()}
document.querySelectorAll('.nav-button').forEach(b=>b.onclick=()=>{state.screen=b.dataset.screen;state.tab=state.screen==='embalagens'?'tipos':state.screen==='bags'?'manutencao':'';render()});$('#tabs').addEventListener('click',e=>{const b=e.target.closest('[data-tab]');if(!b)return;state.tab=b.dataset.tab;render()});modal.addEventListener('click',e=>{if(e.target===modal)modal.close()});render();
</script>
</body>
</html>
